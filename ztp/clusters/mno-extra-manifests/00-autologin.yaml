---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 99-master-autologin
spec:
  config:
    ignition:
      version: 3.1.0
    systemd:
      enabled: True
      units:
      - dropins:
        - contents: |
            [Service]
            ExecStart=
            ExecStart=-/usr/sbin/agetty --autologin core --noclear %I $TERM
          name: autologin-core.conf
        name: getty@.service
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-worker-autologin
spec:
  config:
    ignition:
      version: 3.1.0
    systemd:
      enabled: True
      units:
      - dropins:
        - contents: |
            [Service]
            ExecStart=
            ExecStart=-/usr/sbin/agetty --autologin core --noclear %I $TERM
          name: autologin-core.conf
        name: getty@.service
