    rootDeviceHints:
      deviceName: "/dev/vda"
    interfaces:
      - name: random
        macAddress: 86:4f:d6:29:20:46
    networkConfig:
      interfaces:
        - name: random
          type: ethernet
          state: up
          ipv4:
            enabled: false
          ipv6:
            enabled: false
        - name: vlan30
          type: vlan
          state: up
          vlan:
            base-iface: random
            id: 30
          ipv4:
            enabled: true
            address:
              - ip: 10.10.30.230
                prefix-length: 24
            dhcp: false
          ipv6:
            enabled: true
            address:
              - ip: 2600:10:10:30::230
                prefix-length: 64
            dhcp: false
            autoconf: false
        - name: vlan40
          type: vlan
          state: up
          vlan:
            base-iface: random
            id: 40
          ipv4:
            enabled: true
            address:
              - ip: 10.10.40.230
                prefix-length: 24
            dhcp: false
          ipv6:
            enabled: true
            address:
              - ip: 2600:10:10:40::230
                prefix-length: 64
            dhcp: false
            autoconf: false
      dns-resolver:
        config:
          server:
            - 10.10.20.10
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 10.10.30.1
            next-hop-interface: vlan30
            table-id: 254
          - destination: ::/0
            next-hop-address: 2600:10:10:30::1
            next-hop-interface: vlan30
            table-id: 254
