# Day-2: Move br-ex from vlan30/enp1s0 to bond0.30/bond0/enp1s0 on master-2
#
# Removes old vlan30 (on enp1s0, from agent-config) and creates:
#   bond0 (active-backup) with enp1s0
#   bond0.30 (VLAN 30 on bond0)
#   br-ex (OVS bridge) on bond0.30
#
# Uses different interface name (bond0.30 vs vlan30) to avoid nmstate
# conflict with existing NM connection. nmstate processes absent before up.
#
# Decoded mno-master-2.yml:
#
#   interfaces:
#   - name: vlan30
#     type: vlan
#     state: absent
#   - name: enp1s0
#     type: ethernet
#     state: up
#     ipv4: { enabled: false }
#     ipv6: { enabled: false }
#   - name: bond0
#     type: bond
#     state: up
#     link-aggregation: { mode: active-backup, port: [enp1s0] }
#   - name: bond0.30
#     type: vlan
#     state: up
#     vlan: { base-iface: bond0, id: 30 }
#   - name: br-ex
#     type: ovs-bridge
#     state: up
#     bridge:
#       options: { mcast-snooping-enable: false }
#       port: [{ name: bond0.30 }, { name: br-ex }]
#   - name: br-ex
#     type: ovs-interface
#     state: up
#     copy-mac-from: enp1s0
#     ipv4: { enabled: true, address: [{ ip: 10.10.30.232, prefix-length: 24 }] }
#     ipv6: { enabled: true, address: [{ ip: 2600:10:10:30::232, prefix-length: 64 }] }
#   dns-resolver: { config: { server: [10.10.20.10] } }
#   routes:
#     config:
#     - { destination: 0.0.0.0/0, next-hop-address: 10.10.30.1, next-hop-interface: br-ex }
#     - { destination: ::/0, next-hop-address: 2600:10:10:30::1, next-hop-interface: br-ex }
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: mc-bond30-master2
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - path: /etc/nmstate/openshift/mno-master-2.yml
        mode: 0644
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
