# Day-2: Move master-1 br-ex from vlan30/enp1s0 to bond0.30/bond0/enp1s0
# Applied via NNCP -- no reboot needed (requires nmstate MC ownership first).
# Uses vlan30: absent + bond0.30 rename to avoid NM connection conflict.
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: br-ex-bond-master-1
spec:
  nodeSelector:
    kubernetes.io/hostname: mno-master-1
  desiredState:
    interfaces:
    - name: vlan30
      type: vlan
      state: absent
    - name: enp1s0
      type: ethernet
      state: up
      ipv4:
        enabled: false
      ipv6:
        enabled: false
    - name: bond0
      type: bond
      state: up
      link-aggregation:
        mode: active-backup
        port:
        - enp1s0
      ipv4:
        enabled: false
      ipv6:
        enabled: false
    - name: bond0.30
      type: vlan
      state: up
      vlan:
        base-iface: bond0
        id: 30
    - name: br-ex
      type: ovs-bridge
      state: up
      bridge:
        options:
          mcast-snooping-enable: false
        port:
        - name: bond0.30
        - name: br-ex
    - name: br-ex
      type: ovs-interface
      state: up
      copy-mac-from: enp1s0
      ipv4:
        enabled: true
        address:
        - ip: 10.10.30.231
          prefix-length: 24
      ipv6:
        enabled: true
        address:
        - ip: 2600:10:10:30::231
          prefix-length: 64
    dns-resolver:
      config:
        server:
        - 10.10.20.10
    routes:
      config:
      - destination: 0.0.0.0/0
        next-hop-address: 10.10.30.1
        next-hop-interface: br-ex
      - destination: ::/0
        next-hop-address: 2600:10:10:30::1
        next-hop-interface: br-ex
