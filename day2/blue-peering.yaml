---
apiVersion: metallb.io/v1beta1
kind: BFDProfile
metadata:
  name: simple
  namespace: metallb-system
spec:
  receiveInterval: 2000
  transmitInterval: 1000
  detectMultiplier: 3
  echoInterval: 300
  echoMode: false
  passiveMode: false
  minimumTtl: 254
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: blue
  namespace: metallb-system
spec:
  peerAddress: 10.10.10.1
  peerASN: 65001
  myASN: 7003
  enableGracefulRestart: false
  bfdProfile: simple
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/worker: ""
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: blue
  namespace: metallb-system
spec:
  ipAddressPools:
    - blue
  peers:
    - blue
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: blue
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 4.4.4.1/32
    - 2001:db8:0:0:0:0:4:1/128
