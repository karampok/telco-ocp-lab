---
apiVersion: metallb.io/v1beta1
kind: BFDProfile
metadata:
  name: green
  namespace: metallb-system
spec:
  receiveInterval: 2000
  transmitInterval: 1000
  detectMultiplier: 3
  echoInterval: 300
  echoMode: false
  passiveMode: false
  minimumTtl: 254
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: green
  namespace: metallb-system
spec:
  peerAddress: 11.11.11.1
  peerASN: 8011
  myASN: 7003
  holdTime: 60s
  bfdProfile: green
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/worker: ""
        kubernetes.io/hostname: "w1"
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: green
  namespace: metallb-system
spec:
  ipAddressPools:
    - green
  peers:
    - green
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/worker: ""
        kubernetes.io/hostname: "w1"
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: green
  namespace: metallb-system
spec:
  autoAssign: false
  addresses:
    - 5.5.5.1/32
    - 5.5.5.2/32
    - 2001:db8:0:0:0:0:5:1/128
