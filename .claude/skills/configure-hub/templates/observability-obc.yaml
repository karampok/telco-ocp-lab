# Requires NooBaa (openshift-storage.noobaa.io) — comes with ODF, NOT available with LVMS only.
# On SNO without ODF: create thanos-object-storage secret manually from an external S3 store
# and skip this file + thanos-secret-policy.yaml.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: observability-obc
  namespace: open-cluster-management-observability
spec:
  generateBucketName: observability-object-bucket
  storageClassName: openshift-storage.noobaa.io
