apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  annotations:
    installer.open-cluster-management.io/mce-subscription-spec: '{"source": "redhat-operators", "installPlanApproval": "Automatic"}'
    installer.open-cluster-management.io/oadp-subscription-spec: '{"source": "redhat-operators", "installPlanApproval": "Automatic"}'
  name: multiclusterhub
  namespace: open-cluster-management
spec:
  availabilityConfig: High
  enableClusterBackup: false
  ingress: {}
  localClusterName: local-cluster
  overrides:
    components:
    - enabled: true
      name: app-lifecycle
    - enabled: true
      name: cluster-lifecycle
    - enabled: true
      name: cluster-permission
    - enabled: true
      name: console
    - enabled: true
      name: grc
    - enabled: true
      name: insights
    - enabled: true
      name: multicluster-engine
    - enabled: true
      name: multicluster-observability
    - enabled: true
      name: search
    - enabled: true
      name: submariner-addon
    - enabled: true
      name: volsync
    - enabled: true
      name: cluster-backup
    - enabled: true
      name: siteconfig
    - enabled: false
      name: fine-grained-rbac
    - enabled: false
      name: cnv-mtv-integrations
  separateCertificateManagement: false
