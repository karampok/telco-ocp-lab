---
apiVersion: v1alpha1
metadata:
  name: sno
additionalNTPSources:
  - pool.ntp.org
hosts:
  - hostname: sno
    role: master
    rootDeviceHints:
      deviceName: "/dev/vda"
    interfaces:
      - name: enp1s0
        macAddress: 4a:a3:29:34:18:df
    networkConfig:
      interfaces:
        - name: enp1s0
          type: ethernet
          state: up
          ipv4:
            enabled: true
            address:
              - ip: 10.10.10.225
                prefix-length: 24
            dhcp: false
          ipv6:
            enabled: true
            address:
              - ip: 2600:10:10:10::225
                prefix-length: 64
            dhcp: false
            autoconf: false
      dns-resolver:
        config:
          server:
            - 10.10.20.10
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 10.10.10.1
            next-hop-interface: enp1s0
            table-id: 254
          - destination: ::/0
            next-hop-address: 2600:10:10:10::1
            next-hop-interface: enp1s0
            table-id: 254
