# NMPolicy-based br-ex configuration for dual-stack clusters.
# Uses nmstatectl capture expressions to dynamically resolve per-node
# IP, MAC, MTU, and routes from vlan40 (VLAN 100) at boot time.
# Same MC works for SNO and MNO as long as all nodes use vlan40.
#
# Decoded cluster.yml content:
#
#   capture:
#     base-iface: interfaces.name=="vlan40"
#     new-iface: capture.base-iface | interfaces.ipv4.forwarding:=null
#     base-iface-routes: routes.running.next-hop-interface=="vlan40"
#     bridge-routes: capture.base-iface-routes | routes.running.next-hop-interface:="br-ex"
#   desired:
#     routes:
#       config: "{{ capture.bridge-routes.routes.running }}"
#     interfaces:
#     - name: br-ex
#       type: ovs-interface
#       state: up
#       mac-address: "{{ capture.new-iface.interfaces.0.mac-address }}"
#       ipv4: "{{ capture.new-iface.interfaces.0.ipv4 }}"
#       ipv6: "{{ capture.new-iface.interfaces.0.ipv6 }}"
#       mtu: "{{ capture.new-iface.interfaces.0.mtu }}"
#     - name: br-ex
#       type: ovs-bridge
#       state: up
#       bridge:
#         options:
#           mcast-snooping-enable: false
#         port:
#         - name: vlan40
#         - name: br-ex
#
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: master
  name: 10-br-ex-sno
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
      - path: /etc/nmstate/openshift/cluster.yml
        mode: 0644
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
